  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <!-- Inter for body text; Fraunces (regular, semibold, italic) for headings -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet" />
  <!-- Set the theme before React loads so there's no light/dark flash -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      document.documentElement.setAttribute("data-theme", t === "light" || t === "dark" ? t : "dark");
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
